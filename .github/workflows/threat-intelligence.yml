name: AI Threat Intelligence Update

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of days to look back for threats'
        required: false
        default: '7'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  scan-threat-landscape:
    name: Scan AI Threat Landscape
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/threat-intelligence/requirements.txt

      - name: Fetch CVE Database
        id: fetch_cves
        run: |
          python scripts/threat-intelligence/fetch_cves.py \
            --days-back ${{ github.event.inputs.days_back || '7' }} \
            --output data/cves.json
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Fetch Security Advisories
        id: fetch_advisories
        run: |
          python scripts/threat-intelligence/fetch_advisories.py \
            --output data/advisories.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Research Papers
        id: fetch_research
        run: |
          python scripts/threat-intelligence/fetch_research.py \
            --days-back ${{ github.event.inputs.days_back || '7' }} \
            --output data/research.json

      - name: Analyze with LLM
        id: analyze
        run: |
          python scripts/threat-intelligence/analyze_threats.py \
            --cves data/cves.json \
            --advisories data/advisories.json \
            --research data/research.json \
            --output data/analysis.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Generate Documentation Updates
        id: generate_docs
        run: |
          python scripts/threat-intelligence/generate_updates.py \
            --analysis data/analysis.json \
            --output-dir content/ai_exchange/content/docs/threats/ \
            --summary data/update_summary.json

      - name: Update Threat Dashboard
        run: |
          python scripts/threat-intelligence/update_dashboard.py \
            --analysis data/analysis.json \
            --output content/ai_exchange/content/threat-intelligence.md

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT

            # Count new threats
            NEW_THREATS=$(jq '.new_threats | length' data/update_summary.json)
            UPDATED_THREATS=$(jq '.updated_threats | length' data/update_summary.json)

            echo "new_threats=$NEW_THREATS" >> $GITHUB_OUTPUT
            echo "updated_threats=$UPDATED_THREATS" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            feat(threat-intel): automated threat intelligence update

            - New threats discovered: ${{ steps.check_changes.outputs.new_threats }}
            - Updated threats: ${{ steps.check_changes.outputs.updated_threats }}
            - Analysis date: ${{ github.run_id }}

            This PR was automatically generated by the AI Threat Intelligence system.
            Please review the changes and verify accuracy before merging.
          branch: threat-intel/auto-update-${{ github.run_id }}
          delete-branch: true
          title: '🤖 AI Threat Intelligence Update - ${{ github.run_id }}'
          body: |
            ## 🤖 Automated Threat Intelligence Update

            This PR contains automatically discovered and analyzed AI security threats.

            ### 📊 Summary
            - **New threats**: ${{ steps.check_changes.outputs.new_threats }}
            - **Updated threats**: ${{ steps.check_changes.outputs.updated_threats }}
            - **Analysis period**: Last ${{ github.event.inputs.days_back || '7' }} days

            ### 🔍 Sources Analyzed
            - ✅ CVE Database (NVD)
            - ✅ GitHub Security Advisories
            - ✅ arXiv AI Security Papers
            - ✅ Security Vendor Disclosures

            ### 🧠 AI Analysis
            All threats were analyzed using Claude/GPT to:
            - Categorize according to OWASP AI taxonomy
            - Extract technical details
            - Identify affected systems
            - Suggest mitigation controls
            - Generate documentation snippets

            ### ✅ Review Checklist
            - [ ] Verify threat descriptions are accurate
            - [ ] Check OWASP category mappings
            - [ ] Validate control recommendations
            - [ ] Review references and CVE links
            - [ ] Ensure no sensitive information disclosed
            - [ ] Check for duplicate content

            ### 📝 Files Changed
            See the diff below for all documentation updates.

            ---

            **Note**: This is an automated PR. Human review is required before merging.
            Generated by workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            threat-intelligence
            automated
            documentation
          draft: false

      - name: Post summary
        if: always()
        run: |
          echo "## 🤖 Threat Intelligence Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ -f data/update_summary.json ]]; then
            echo "### 📊 Statistics" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **New threats**: $(jq -r '.new_threats | length' data/update_summary.json)" >> $GITHUB_STEP_SUMMARY
            echo "- **Updated threats**: $(jq -r '.updated_threats | length' data/update_summary.json)" >> $GITHUB_STEP_SUMMARY
            echo "- **Total analyzed**: $(jq -r '.total_analyzed' data/update_summary.json)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [[ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]]; then
              echo "✅ **Pull Request Created**: Review automated updates" >> $GITHUB_STEP_SUMMARY
            else
              echo "ℹ️ **No Changes**: No new threats discovered in this scan" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ **Error**: Analysis failed - check logs above" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threat-intelligence-data
          path: |
            data/*.json
          retention-days: 30
