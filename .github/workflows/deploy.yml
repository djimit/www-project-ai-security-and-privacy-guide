name: Deploy to Live Channel

on:
  push:
    branches:
      - main
    # Optionally configure to run only for specific files. For example:
    # paths:
    # - "website/**"

jobs:
  deploy_live_website:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Add any build steps here. For example:
      # - run: npm ci && npm run build
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.119.0'
          # extended: true
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: content/ai_exchange/go.sum

      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hugo_cache
            content/ai_exchange/resources
          key: ${{ runner.os }}-hugo-${{ hashFiles('content/ai_exchange/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: content/ai_exchange/package-lock.json

      - name: Install dependencies
        working-directory: content/ai_exchange
        run: npm ci

      - name: Build and optimize assets
        working-directory: content/ai_exchange
        run: |
          npm run build:prod
          npm run compress
          npm run size

      - name: Build Hugo site
        run: |
         cd content/ai_exchange
         hugo mod get
         hugo --gc --minify
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: project-integration-standards
          target: owasp-ai-exchange
          channelId: live
          entryPoint: content/ai_exchange
