name: OpenSSF Scorecard

on:
  # Run on default branch
  branch_protection_rule:
  schedule:
    # Run weekly on Sundays
    - cron: '0 2 * * 0'
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Declare permissions at top-level
permissions: read-all

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload results to code-scanning dashboard
      security-events: write
      # Needed to publish results and get status
      id-token: write
      # Needed to read repository contents
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.3.1
        with:
          results_file: results.sarif
          results_format: sarif
          # Read-only PAT token (optional for private repos)
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

          # Publish results to OpenSSF REST API
          publish_results: true

      # Upload results to GitHub Security tab
      - name: Upload SARIF results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      # Upload results as artifact for record-keeping
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 90
